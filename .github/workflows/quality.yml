name: Website quality

on:
  push:
    branches:
      - main
      - "sprint-01/**"
      - "v1/**"
  pull_request:
    branches:
      - main
      - "sprint-01/**"
      - "v1/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build production site
        run: npm run build
